<!DOCTYPE html>
<html>
<head>
    <title>Diet Recommendation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 40px;
        }

        .container {
            width: 750px;
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #2b4f81;
        }

        h3 {
            color: #333;
            margin-top: 20px;
        }

        .food-box {
            background: #f9fcff;
            padding: 12px;
            border-left: 5px solid #007bff;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .avoid-box {
            background: #fff5f5;
            padding: 12px;
            border-left: 5px solid #dc3545;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 16px;
        }

        a.back-btn {
            display: inline-block;
            margin-top: 20px;
            background: #007bff;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        a.back-btn:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>{{ plan_type }}</h2>

    <h3>Recommended Foods</h3>
    {% if foods %}
        {% for item in foods %}
            <div class="food-box">{{ item }}</div>
        {% endfor %}
    {% else %}
        <p>No food data available.</p>
    {% endif %}

    <h3>Foods to Avoid</h3>
    {% if avoid %}
        {% for item in avoid %}
            <div class="avoid-box">{{ item }}</div>
        {% endfor %}
    {% else %}
        <p>No avoidance data available.</p>
    {% endif %}

    <a href="/dashboard" class="back-btn">Back to Dashboard</a>

</div>
</body>
</html>
