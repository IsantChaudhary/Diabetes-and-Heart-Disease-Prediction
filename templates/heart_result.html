<!DOCTYPE html>
<html>
<head>
<title>Heart Result</title>

<style>

body{
    font-family: Arial;
    background-color:#f4f6f9;
    text-align:center;
}

.container{
    width:400px;
    margin:auto;
    margin-top:150px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

h2{
    color:#333;
    margin-bottom:20px;
}

.result{
    font-size:22px;
    font-weight:bold;
    margin:20px;
    color:#e74c3c;
}

button{
    padding:10px 20px;
    background-color:#3498db;
    color:white;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background-color:#2980b9;
}

</style>

</head>

<body>

<div class="container">

<h2>Heart Prediction Result</h2>

<div class="result">
{{result}}
</div>

<br>

<a href="/choose">
<button>Back</button>
</a>

</div>

</body>

</html>
