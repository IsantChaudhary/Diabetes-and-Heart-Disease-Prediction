<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-top: 40px;
        }

        form {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            width: 80%;
            max-width: 600px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #2c3e50;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: 2px solid #2c3e50;
            border-left: none;
            background-color: #2c3e50;
            color: #fff;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #34495e;
        }

        h3 {
            margin-top: 30px;
            color: #2c3e50;
        }

        p {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 5px;
            max-width: 600px;
            word-wrap: break-word;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #fff;
            background-color: #2c3e50;
            padding: 10px 20px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        a:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <h1>Chatbot</h1>
    <form method="POST">
        <input type="text" name="message" placeholder="Ask me something..." required>
        <button type="submit">Send</button>
    </form>

    {% if response %}
    <h3>Response:</h3>
    <p>{{ response }}</p>
    {% endif %}

    <a href="/index">Back to Home</a>
</body>
</html>
