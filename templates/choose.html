<!DOCTYPE html>
<html>
<head>
<title>Select Prediction</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#dfe9f3,#ffffff);
}

.container{
    background:white;
    padding:50px 60px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
    text-align:center;
    transition:0.3s;
}

.container:hover{
    transform:translateY(-5px);
}

h2{
    color:#333;
    margin-bottom:35px;
    font-size:28px;
}

button{
    width:230px;
    padding:15px;
    font-size:17px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin:12px;
    transition: all 0.3s ease;
}

.diabetes{
    background:linear-gradient(45deg,#28a745,#4CAF50);
    color:white;
}

.heart{
    background:linear-gradient(45deg,#ff4b2b,#e74c3c);
    color:white;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 8px 18px rgba(0,0,0,0.2);
}

button:active{
    transform:scale(0.98);
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<div class="container">

<h2>Select Prediction</h2>

<a href="/index">
<button class="diabetes">Diabetes Prediction</button>
</a>

<br><br>

<a href="/heart">
<button class="heart">Heart Prediction</button>
</a>

</div>

</body>
</html>
